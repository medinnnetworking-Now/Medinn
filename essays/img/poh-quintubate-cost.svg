<svg viewBox="0 0 904 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bars drawn to scale: a laryngoscope at 1,000 to 2,000 rupees, UVEAL under 10,000 rupees, a video-laryngoscope at 2 to 3 lakh rupees"><defs><pattern id="hcost" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#EDF1FA" stroke-width="2.2"/></pattern></defs>
<g font-family="Inter,Helvetica,Arial,sans-serif" fill="#EDF1FA">
<text x="0" y="28" font-size="20" font-weight="700" letter-spacing="1.5" font-family="JetBrains Mono,monospace">DRAWN TO SCALE (₹)</text>
<text x="0" y="86" font-size="26" font-weight="600">Standard laryngoscope</text>
<rect x="0" y="100" width="4" height="34" fill="#EDF1FA"/><rect x="4" y="100" width="0" height="34" fill="url(#hcost)"/>
<text x="20" y="126" font-size="24" font-weight="700" font-family="JetBrains Mono,monospace">₹1,000 to 2,000</text>
<text x="0" y="192" font-size="26" font-weight="600" fill="#6E95FF">UVEAL attachment (company figure)</text>
<rect x="0" y="206" width="28" height="34" fill="#6E95FF"/>
<text x="42" y="232" font-size="24" font-weight="700" font-family="JetBrains Mono,monospace" fill="#6E95FF">starts under ₹10,000</text>
<text x="0" y="298" font-size="26" font-weight="600">Video-laryngoscope (as shown in his video)</text>
<rect x="0" y="312" width="560" height="34" fill="#EDF1FA"/><rect x="560" y="312" width="280" height="34" fill="url(#hcost)" stroke="#EDF1FA" stroke-width="2"/>
<text x="350" y="372" font-size="24" font-weight="700" font-family="JetBrains Mono,monospace">₹2,00,000 to ₹3,00,000</text></g></svg>