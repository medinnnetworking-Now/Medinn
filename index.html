function get(scope, path){ return path.replace(/[{}]/g,'').trim().split('.').reduce((o,k)=> o==null ? undefined : o[k], scope); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function interp(str, scope){ return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m,p)=>{ const v=get(scope,p); return v==null ? '' : String(v); }); }
function kids(node, scope){ let o=''; node.childNodes.forEach(c=>{ o+=rn(c,scope); }); return o; }
function rn(node, scope){
  if (node.nodeType===3) return esc(interp(node.nodeValue, scope));
  if (node.nodeType!==1) return '';
  const tag=node.tagName.toLowerCase();
  if (tag==='sc-for'){ const list=get(scope,node.getAttribute('list'))||[]; const as=node.getAttribute('as'); return list.map(it=>{ const s=Object.create(scope); s[as]=it; return kids(node,s); }).join(''); }
  if (tag==='sc-if'){ return get(scope,node.getAttribute('value')) ? kids(node,scope) : ''; }
  let a='';
  for (const at of node.attributes){
    if (at.name.startsWith('hint-')) continue;
    if (at.name==='onclick'){ H.push(get(scope,at.value)); a+=' data-h="'+(H.length-1)+'"'; continue; }
    a+=' '+at.name+'="'+esc(interp(at.value,scope))+'"';
  }
  if (VOID.has(tag)) return '<'+tag+a+'>';
  return '<'+tag+a+'>'+kids(node,scope)+'</'+tag+'>';
}
const root = document.getElementById('root');
function render(){
  H = [];
  const html = kids(tpl, comp.renderVals());
  if (window.morphdom){ morphdom(root, '<div id="root">'+html+'</div>'); } else { root.innerHTML = html; }
}
document.addEventListener('click', e=>{ const el=e.target.closest('[data-h]'); if (el){ const f=H[+el.getAttribute('data-h')]; if (typeof f==='function') f(); } });
render();
</script>
